<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 가족 간병비 예상 계산기</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#17252c;font-family:system-ui,sans-serif}main{max-width:650px;margin:24px auto;padding:24px;background:white;border:1px solid #d8dfe2;border-radius:18px}h1{font-size:24px;text-align:center;margin:0 0 24px}label{display:block;font-weight:600;margin:16px 0 8px}input[type=number]{width:100%;padding:13px;border:1px solid #ccd3d8;border-radius:10px;font:inherit}input[type=range]{width:100%;accent-color:#298477}.line{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted,small{color:#58636b;font-size:13px;line-height:1.7}.result{font-size:30px;font-weight:800;color:#00713b;margin:8px 0 18px}.bar{display:flex;height:24px;border-radius:6px;overflow:hidden;margin:12px 0;background:#298477}.part{background:#a1aab6}.legend{font-size:13px}.legend i{display:inline-block;width:10px;height:10px;margin-right:5px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.summary strong{display:block;color:#00713b;font-size:clamp(17px,4vw,24px);margin-top:6px}button{width:100%;padding:13px;margin:5px 0;border:1px solid #298477;border-radius:10px;background:#298477;color:white;font:inherit;cursor:pointer}button.secondary{background:white;color:#298477}button:disabled{opacity:.5}hr{border:0;border-top:1px solid #dfe4e6;margin:22px 0}@media(max-width:680px){main{margin:12px;padding:18px}}</style></head><body><main><h1>🧮 우리 가족 간병비 예상 계산기</h1><label for="daily">하루 간병비 (원)</label><input id="daily" type="number" min="0" step="1" value="50000"><label for="days">월 간병 일수 (1~31일)</label><input id="days" type="number" min="1" max="31" step="1" value="30"><label for="rate" class="line"><span>가정한 본인부담률</span><strong id="pct">30%</strong></label><input id="rate" type="range" min="0" max="100" step="5" value="30"><div class="line muted"><span>0%</span><span>50%</span><span>100%</span></div><hr><div class="line">기존 월 간병비 <strong id="total"></strong></div><p class="muted">지원 이후 예상 본인부담액</p><div id="pay" class="result"></div><div class="bar" aria-label="본인부담금 및 절약금액 비율"><div id="part" class="part"></div></div><div class="legend"><i style="background:#a1aab6"></i>본인부담금　<i style="background:#298477"></i>절약 예상금액</div><hr><div class="summary"><div>월 절약 예상액<strong id="save"></strong></div><div>12개월 절약 예상액<strong id="annual"></strong></div></div><button id="copy">계산 결과 복사</button><button id="reset" class="secondary">다시 계산하기</button><div id="status" role="status" class="muted"></div><p><small>※ 간병비 전액이 급여화 대상이라는 가정 아래 본인부담률을 임의로 설정하는 모의 계산기입니다. 실제 지원금액 및 수급 자격을 확정하는 계산기가 아닙니다. 연간 금액은 동일 조건 12개월을 가정합니다.</small></p><small>곰비의 알짜정보</small></main><script>const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ko-KR')+'원';let result='';function calc(){const d=Number($('daily').value),n=Number($('days').value),r=Number($('rate').value);$('pct').textContent=r+'%';$('part').style.width=r+'%';const t=d*n,ok=$('daily').value!==''&&$('days').value!==''&&Number.isSafeInteger(d)&&d>=0&&Number.isInteger(n)&&n>=1&&n<=31&&Number.isSafeInteger(t*12);const p=Math.round(t*r/100),s=t-p;for(const [id,v] of Object.entries({total:t,pay:p,save:s,annual:s*12}))$(id).textContent=ok?fmt(v):'—';$('copy').disabled=!ok;$('status').textContent=ok?'':'간병비와 간병 일수를 확인하세요.';result=ok?`우리 가족 간병비 예상 계산 결과\n기존 월 간병비: ${fmt(t)}\n가정 본인부담률: ${r}%\n예상 본인부담액: ${fmt(p)}\n월 절약 예상액: ${fmt(s)}\n12개월 절약 예상액: ${fmt(s*12)}\n※ 모의 계산 결과입니다.`:'';}for(const id of ['daily','days','rate'])$(id).addEventListener('input',calc);$('reset').onclick=()=>{$('daily').value=50000;$('days').value=30;$('rate').value=30;calc()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(result);$('status').textContent='계산 결과가 복사되었습니다.'}catch{const a=document.createElement('textarea');a.value=result;document.body.append(a);a.select();let copied=false;try{copied=document.execCommand('copy')}catch{}a.remove();$('status').textContent=copied?'계산 결과가 복사되었습니다.':'복사가 지원되지 않는 환경입니다.'}};calc();</script></body></html>
